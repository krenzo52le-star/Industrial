name: Build mod from zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack industria-mod.zip
        run: unzip -q industria-mod.zip

      - name: JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Gradle 4.9 (needed by ForgeGradle 2.3)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 4.9

      - name: Build (tries several Forge 1.12.2 versions)
        working-directory: industria
        run: |
          for v in 14.23.5.2860 14.23.5.2847 14.23.5.2838 14.23.5.2768; do
            echo "=== Trying Forge 1.12.2-$v"
            sed -i -E "s/1\.12\.2-14\.23\.5\.[0-9]+/1.12.2-$v/" build.gradle
            if gradle setupCIWorkspace build --no-daemon; then
              echo "=== Build OK with Forge $v"
              exit 0
            fi
          done
          echo "All Forge versions failed"
          exit 1

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: industria-jar
          path: industria/build/libs/*.jar
