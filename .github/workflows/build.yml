name: Build mod from zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack industria-mod.zip
        run: unzip -q industria-mod.zip

      - name: JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Gradle 4.9 (needed by ForgeGradle 2.3)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 4.9

      - name: Build
        working-directory: industria
        run: gradle setupCIWorkspace build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: industria-jar
          path: industria/build/libs/*.jar
          
